<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kotoba Minna no Nihongo Bab 1–3</title>
    <meta
      name="description"
      content="Rangkuman kosakata Minna no Nihongo Bab 1–3 dengan mode hafalan."
    />
    <meta name="theme-color" content="#24315e" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>語</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css">
   
  </head>
  <body class="loading">
    <div id="splash" role="status" aria-label="Memuat">
      <div class="sp-mark" lang="ja">語</div>
      <div class="sp-title" lang="ja">みんなの日本語</div>
      <div class="sp-sub">Kotoba Bab 1-3</div>
      <div class="sp-bar"><i></i></div>
    </div>
    <header>
      <div class="wrap">
        <h1>Kotoba Minna no Nihongo</h1>
        <p class="sub" id="sub"></p>
        <div class="tools">
          <input
            type="search"
            id="q"
            placeholder="Cari kata, romaji, atau arti"
            aria-label="Cari kosakata"
          />
          <button id="mode" aria-pressed="false">Mode hafalan</button>
        </div>
      </div>
    </header>
    <main><div class="wrap" id="list"></div></main>
    <nav aria-label="Pilih bab"><div class="wrap" id="tabs"></div></nav>
    <script src="./script.js"></script>
  </body>
</html>
